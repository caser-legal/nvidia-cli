[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "nvidia-cli-nat"
version = "1.0.0"
description = "NeMo Agent Toolkit integration for nvidia-cli (dory)"
requires-python = ">=3.11"
dependencies = [
    "nvidia-nat[langchain,mcp,phoenix,data-flywheel,profiling,opentelemetry]~=1.3",
]

[project.entry-points.'nat.plugins']
nvidia_cli = "nvidia_cli_nat.register"

[tool.setuptools.packages.find]
where = ["src"]
